<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ReadTaylor</title>
    <meta name="description" content="ReadTaylor 是一个支持 TXT、EPUB、PDF 的本地小说阅读器。" />
    <meta name="theme-color" content="#edf0ea" />
    <!-- PWA：添加到主屏后以独立窗口打开，手机浏览器地址栏几乎消失 -->
    <link rel="manifest" href="manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ReadTaylor" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <!-- ?v= 版本号：每次发版改一下，强制手机浏览器/中间CDN放弃旧缓存 -->
    <link rel="stylesheet" href="styles.css?v=2026061204" />
  </head>
  <body>
    <a class="skip-link" href="#reader">跳到正文</a>
    <div class="app-shell" data-theme="paper">
      <aside id="library-panel" class="library-panel" aria-label="书库">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">RT</div>
          <div>
            <h1>ReadTaylor</h1>
            <p>本地小说阅读器</p>
          </div>
        </div>

        <section class="import-box" aria-label="导入书籍">
          <label class="format-select">
            <span>导入格式</span>
            <select id="book-format">
              <option value="auto">自动识别</option>
              <option value="txt">TXT 纯文本</option>
              <option value="epub">EPUB 电子书</option>
              <option value="mobi">MOBI Kindle</option>
              <option value="azw3">AZW3 Kindle</option>
              <option value="pdf">PDF 固定排版</option>
            </select>
          </label>
          <label class="import-button" for="book-file">
            <span aria-hidden="true">+</span>
            <span>导入书籍</span>
          </label>
          <input id="book-file" type="file" accept=".txt,text/plain,.epub,application/epub+zip,.mobi,.azw3,.pdf,application/pdf" />
          <p id="import-status" class="import-status">支持 TXT、EPUB、PDF；MOBI/AZW3 会提示转换建议。</p>
        </section>

        <section class="panel-section">
          <div class="section-title">
            <span>当前书籍</span>
            <button id="clear-book" class="ghost-button" type="button">清空</button>
          </div>
          <div id="book-card" class="book-card empty">
            <div class="book-cover" aria-hidden="true">
              <span>读</span>
            </div>
            <div>
              <strong id="book-title">还没有导入书</strong>
            <p id="book-meta">选择书籍格式并导入文件</p>
            </div>
          </div>
        </section>

      </aside>

      <main class="reader-shell">
        <!-- 书库拉手是 fixed 悬浮元素，放在顶栏外面：
             顶栏淡出（滚动隐藏/书库展开）时它必须留着，否则书库收不回去 -->
        <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="展开书库" aria-expanded="true" aria-controls="library-panel"></button>
        <header class="reader-toolbar" aria-label="阅读工具栏">
          <div class="reader-status">
            <strong id="reading-percent">0%</strong>
            <!-- 移动端：把下面 7 个功能收进底部弹出菜单，桌面端此按钮隐藏 -->
            <button id="actions-menu-toggle" class="actions-menu-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="toolbar-actions" title="功能菜单">菜单</button>
          </div>
          <div id="toolbar-actions" class="toolbar-actions">
            <button id="immersive-toggle" class="tool-button" type="button">沉浸</button>
            <!-- 翻译按钮：左键开关；右键或长按打开设置面板 -->
            <button id="translate-toggle" class="tool-button" type="button" title="点击开启/关闭翻译；右键或长按打开翻译设置">翻译</button>
            <!-- 朗读：从当前段落起按句朗读，浏览器原生 TTS -->
            <button id="tts-button" class="tool-button" type="button" title="开始 / 停止朗读">朗读</button>
            <!-- 全文搜索：在整本书中搜词/句，点结果跳到对应段落 -->
            <button id="search-button" class="tool-button" type="button" title="在本书中搜索">搜索</button>
            <!-- 目录：打开本书章节列表，点击章节跳转 -->
            <button id="toc-button" class="tool-button" type="button" title="打开本书目录">目录</button>
            <!-- 我的书签：打开列表面板；加书签 / 加标记走正文右键菜单 -->
            <button id="marks-button" class="tool-button" type="button" title="打开标记列表；正文里右键可加书签/标记">我的书签</button>
            <!-- 版式切换：EPUB/PDF 在「原样排版」和「文本模式」间切换 -->
            <button id="layout-toggle" class="tool-button" type="button" title="原样排版 / 文本模式切换">版式</button>
            <!-- 折叠/展开底部设置栏 -->
            <button id="settings-toggle" class="tool-button" type="button" aria-expanded="false" aria-controls="reading-controls">设置</button>
          </div>
        </header>
        <!-- 移动端底部菜单打开时的半透明遮罩，点它即关闭 -->
        <div id="actions-backdrop" class="actions-backdrop" aria-hidden="true"></div>

        <article id="reader" class="reader" tabindex="0" aria-label="小说正文">
          <section class="empty-state">
            <div class="empty-art" aria-hidden="true">
              <div></div>
              <span></span>
            </div>
            <span class="empty-eyebrow">ReadTaylor</span>
            <h2>导入一本电子书</h2>
            <p>支持 TXT、EPUB 和 PDF 阅读；导入前可以手动选择格式，也可以让网站按文件后缀自动识别。</p>
            <label class="inline-import" for="book-file">选择文件</label>
          </section>
        </article>

        <!-- 原样排版阅读容器：EPUB 用 epub.js rendition、PDF 用 PDF.js 按页
             渲染到这里；fidelity-mode 时正文 #reader 隐藏、本容器显示 -->
        <section id="fidelity-reader" class="fidelity-reader" aria-label="原版排版阅读"></section>
        <!-- EPUB 原样模式是章内滚动，跨章用这两个按钮（PDF 连续滚动用不到） -->
        <div id="fidelity-nav" class="fidelity-nav" hidden>
          <button id="fidelity-prev" type="button">‹ 上一章</button>
          <button id="fidelity-next" type="button">下一章 ›</button>
        </div>

        <section id="translator-panel" class="translator-panel" aria-label="翻译设置" hidden>
          <div class="translator-head">
            <div>
              <span>当前翻译模型</span>
              <strong id="translator-current">未配置</strong>
            </div>
            <button id="translator-close" class="ghost-button" type="button">关闭</button>
          </div>

          <div class="translator-form">
            <label id="translate-api-key-row">
              <span>API Key</span>
              <input id="translate-api-key" type="password" autocomplete="off" placeholder="填入你自己的密钥" />
            </label>

            <label id="translate-endpoint-row">
              <span>Base URL</span>
              <input id="translate-endpoint" type="url" placeholder="https://open.bigmodel.cn/api/paas/v4/" />
            </label>

            <label id="translate-model-row">
              <span>模型名称</span>
              <input id="translate-model" type="text" placeholder="例如 glm-4-flash / deepseek-chat" />
            </label>

            <div id="model-presets" class="model-presets" aria-label="推荐模型">
              <button type="button" data-endpoint="https://open.bigmodel.cn/api/paas/v4/" data-model="glm-4-flash">
                <span>智谱 GLM</span>
                <small>glm-4-flash</small>
              </button>
              <button type="button" data-endpoint="https://api.deepseek.com" data-model="deepseek-chat">
                <span>DeepSeek</span>
                <small>deepseek-chat</small>
              </button>
            </div>

            <label>
              <span>目标语言</span>
              <select id="translate-target">
                <option value="zh-CN">中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
              </select>
            </label>

            <div class="translator-actions">
              <button id="translate-chapter" class="primary-button" type="button">翻译当前内容</button>
              <button id="clear-translation" class="tool-button" type="button">清除译文</button>
            </div>
            <p id="translator-status" class="translator-status">填写 Base URL、API Key、模型后点「翻译」开启；译文显示在每段原文下方，按段缓存到本地，重读不再消耗额度。</p>
          </div>
        </section>

        <section id="search-panel" class="marks-panel search-panel" aria-label="全文搜索" hidden>
          <div class="marks-head">
            <strong>搜索</strong>
            <button id="search-close" class="ghost-button" type="button">关闭</button>
          </div>
          <div class="search-input-row">
            <input id="search-input" type="search" placeholder="输入要搜索的词或句子" autocomplete="off" />
            <span id="search-summary" class="search-summary"></span>
          </div>
          <div id="search-results" class="search-results" role="list"></div>
        </section>

        <section id="toc-panel" class="marks-panel toc-panel" aria-label="目录" hidden>
          <div class="marks-head">
            <strong>目录</strong>
            <button id="toc-close" class="ghost-button" type="button">关闭</button>
          </div>
          <div id="toc-list" class="toc-list" role="list"></div>
        </section>

        <section id="marks-panel" class="marks-panel" aria-label="标记列表" hidden>
          <div class="marks-head">
            <strong>标记</strong>
            <button id="marks-close" class="ghost-button" type="button">关闭</button>
          </div>
          <div id="marks-filter" class="marks-filter" role="tablist" aria-label="标记筛选">
            <button class="marks-filter-tab active" type="button" data-filter="all">全部</button>
            <button class="marks-filter-tab" type="button" data-filter="bookmark">仅书签</button>
            <button class="marks-filter-tab" type="button" data-filter="vocab">生词</button>
            <button class="marks-filter-tab" type="button" data-filter="good">好句</button>
            <button class="marks-filter-tab" type="button" data-filter="hard">难句</button>
            <button class="marks-filter-tab" type="button" data-filter="grammar">语法</button>
          </div>
          <div id="marks-list" class="marks-list"></div>
        </section>

        <div id="tts-bar" class="tts-bar" role="toolbar" aria-label="朗读控制" hidden>
          <button id="tts-prev" class="tts-bar-button" type="button" title="上一段" aria-label="上一段">‹</button>
          <button id="tts-play" class="tts-bar-button tts-bar-play" type="button" title="暂停 / 继续" aria-label="暂停或继续">II</button>
          <button id="tts-next" class="tts-bar-button" type="button" title="下一段" aria-label="下一段">›</button>
          <label class="tts-bar-field">
            <span>语速</span>
            <input id="tts-rate" type="range" min="0.6" max="1.8" step="0.1" value="1" />
            <span id="tts-rate-value" class="tts-bar-value">1.0×</span>
          </label>
          <label class="tts-bar-field">
            <span>音色</span>
            <select id="tts-voice" aria-label="选择音色"></select>
          </label>
          <button id="tts-stop" class="tts-bar-button tts-bar-stop" type="button" title="停止" aria-label="停止朗读">×</button>
        </div>

        <footer id="reading-controls" class="reading-controls" aria-label="阅读设置">
          <div class="control-group">
            <button id="theme-paper" class="segmented active" type="button">纸张</button>
            <button id="theme-night" class="segmented" type="button">夜间</button>
            <button id="theme-mist" class="segmented" type="button">清爽</button>
          </div>
          <label class="range-control">
            <span>字号</span>
            <input id="font-size" type="range" min="16" max="28" value="20" />
          </label>
          <label class="range-control">
            <span>行距</span>
            <input id="line-height" type="range" min="1.55" max="2.2" step="0.05" value="1.8" />
          </label>
          <button id="restore-bookmark" class="tool-button" type="button">回到书签</button>
        </footer>
      </main>
    </div>

    <script src="app.js?v=2026061204"></script>
  </body>
</html>
